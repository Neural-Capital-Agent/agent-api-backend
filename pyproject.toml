[project]
name = "api-neural"
version = "0.1.0"
description = "A FastAPI-based backend service for stock data, trading, and portfolio management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types",
    "anyio",
    "beautifulsoup4",
    "click",
    "crewai>=0.80.0",
    "crewai-tools",
    "curl-cffi",
    "datetime>=5.5",
    "email-validator",
    "fastapi",
    "fastapi-cache2",
    "httpx",
    "httpx-sse",
    "jinja2",
    "jsonschema",
    "mcp[cli]",
    "numpy",
    "packaging",
    "pandas",
    "peewee",
    "pendulum",
    "polygon",
    "postgrest",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dateutil",
    "python-dotenv",
    "python-multipart",
    "pyyaml",
    "requests",
    "rich",
    "sentry-sdk",
    "sse-starlette",
    "starlette",
    "storage3",
    "supabase",
    "typer",
    "uvicorn",
    "yfinance",
    "solana>=0.34.0",
    "solders>=0.21.0",
    "anchorpy>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "core*", "utils*"]
