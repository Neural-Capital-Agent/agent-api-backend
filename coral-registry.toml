# Neural Capital Agents - Coral Protocol Registry Configuration
# This file defines the export settings, pricing, and marketplace configuration
# for all Neural Capital AI agents on the Coral Protocol marketplace

# =============================================================================
# Data Agent Export Configuration
# =============================================================================
[local-agent.export.docker.neural-capital-data-agent]
# Concurrent agent capacity
quantity = 25

# Pricing configuration (USD)
pricing = { 
    min_price = { type = "usd", amount = 2.00 }, 
    max_price = { type = "usd", amount = 15.00 },
    default_price = { type = "usd", amount = 5.00 }
}

# Pre-configured options for marketplace users
options.DATA_REFRESH_INTERVAL = { type = "number", value = 5 }
options.CACHE_DURATION = { type = "number", value = 15 }
options.ENABLE_REAL_TIME = { type = "boolean", value = true }
options.MAX_HISTORICAL_DAYS = { type = "number", value = 365 }

# Service level configurations
[local-agent.export.docker.neural-capital-data-agent.tiers]
basic = { 
    price = { type = "usd", amount = 2.00 },
    equity_universe_limit = 10,
    api_calls_per_hour = 100
}
premium = { 
    price = { type = "usd", amount = 5.00 },
    equity_universe_limit = 50,
    api_calls_per_hour = 500
}
enterprise = { 
    price = { type = "usd", amount = 15.00 },
    equity_universe_limit = 1000,
    api_calls_per_hour = 2000
}

