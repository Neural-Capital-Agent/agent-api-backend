# =============================================================================
# Global Agent Bundle Configuration
# =============================================================================
[local-agent.export.docker.neural-capital-complete-suite]
# Bundle all agents together at discounted rate
quantity = 5

# Bundle pricing (30% discount)
pricing = { 
    min_price = { type = "usd", amount = 60.00 }, 
    max_price = { type = "usd", amount = 150.00 },
    default_price = { type = "usd", amount = 90.00 }
}

# Include all agents in the bundle
includes = [
    "neural-capital-data-agent",
    "neural-capital-portfolio-agent", 
    "neural-capital-explainability-agent",
    "neural-capital-planner-agent"
]

# =============================================================================
# Coral Protocol Marketplace Metadata
# =============================================================================
[marketplace]
publisher = "Neural Capital"
publisher_email = "hello@neural-capital.com"
website = "https://neural-capital.com"
support_email = "support@neural-capital.com"
documentation_url = "https://docs.neural-capital.com/coral-protocol"

# Category and tags for marketplace discovery
category = "Financial Services"
tags = [
    "finance", 
    "investment", 
    "portfolio-management", 
    "risk-analysis", 
    "financial-planning",
    "ai-trading",
    "market-data",
    "explainable-ai"
]

# Compliance and certifications
[marketplace.compliance]
data_privacy = "GDPR, CCPA compliant"
financial_regulations = "SEC, FINRA guidelines"
security_standards = "SOC 2 Type II"

# Regional availability
[marketplace.regions]
available = ["US", "EU", "UK", "CA", "AU"]
restricted = ["CN", "RU"]

# =============================================================================
# Technical Requirements
# =============================================================================
[technical]
minimum_memory = "2GB"
recommended_memory = "4GB"
cpu_requirements = "2 cores"
network_requirements = "Stable internet for market data"
storage_requirements = "1GB for historical data cache"