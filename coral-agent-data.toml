[agent]
name = "neural-capital-data-agent"
version = "1.0.0"
description = "Neural Capital Data Agent - Provides real-time financial market data, macroeconomic indicators, and trading signals for investment analysis"

[options]
EQUITY_UNIVERSE = { type = "string", description = "Comma-separated list of stock symbols to track (e.g., AAPL,GOOGL,MSFT,TSLA)", default = "AAPL,GOOGL,MSFT,TSLA,AMZN,NVDA,META,NFLX,CRM,ADBE" }
POLYGON_API_KEY = { type = "string", description = "Polygon.io API key for market data access" }
FRED_API_KEY = { type = "string", description = "Federal Reserve Economic Data (FRED) API key for macroeconomic data" }
YAHOO_FINANCE_ENABLED = { type = "boolean", description = "Enable Yahoo Finance as a data source", default = true }
DATA_REFRESH_INTERVAL = { type = "number", description = "Data refresh interval in minutes", default = 5 }
CACHE_DURATION = { type = "number", description = "Cache duration for data in minutes", default = 15 }
MAX_HISTORICAL_DAYS = { type = "number", description = "Maximum number of historical days to fetch", default = 365 }
ENABLE_REAL_TIME = { type = "boolean", description = "Enable real-time data updates", default = true }
LOG_LEVEL = { type = "string", description = "Logging level (DEBUG, INFO, WARNING, ERROR)", default = "INFO" }

[runtimes.docker]
image = "neural-capital/data-agent:latest"