[agent]
name = "neural-capital-portfolio-agent"
version = "1.0.0"
description = "Neural Capital Portfolio Agent - Advanced portfolio optimization, risk management, and asset allocation with stress testing and rebalancing strategies"

[options]
RISK_TOLERANCE = { type = "string", description = "Risk tolerance level: conservative, moderate, aggressive", default = "moderate" }
PORTFOLIO_SIZE = { type = "number", description = "Portfolio size in USD", default = 100000.0 }
MAX_POSITION_SIZE = { type = "number", description = "Maximum position size as percentage of portfolio", default = 0.15 }
REBALANCE_THRESHOLD = { type = "number", description = "Portfolio drift threshold for rebalancing (0.05 = 5%)", default = 0.05 }
MIN_CASH_RESERVE = { type = "number", description = "Minimum cash reserve as percentage of portfolio", default = 0.05 }
ENABLE_STRESS_TESTING = { type = "boolean", description = "Enable portfolio stress testing", default = true }
CORRELATION_THRESHOLD = { type = "number", description = "Maximum correlation between assets (0.0-1.0)", default = 0.7 }
VAR_CONFIDENCE_LEVEL = { type = "number", description = "Value at Risk confidence level (0.90-0.99)", default = 0.95 }
LOOKBACK_PERIOD = { type = "number", description = "Historical lookback period in days for analysis", default = 252 }
OPTIMIZATION_METHOD = { type = "string", description = "Portfolio optimization method: mean_variance, risk_parity, black_litterman", default = "mean_variance" }
ENABLE_ESG_FILTERING = { type = "boolean", description = "Enable ESG (Environmental, Social, Governance) filtering", default = false }
MAX_SECTOR_CONCENTRATION = { type = "number", description = "Maximum sector concentration as percentage", default = 0.30 }
LOG_LEVEL = { type = "string", description = "Logging level (DEBUG, INFO, WARNING, ERROR)", default = "INFO" }

[runtimes.docker]
image = "neural-capital/portfolio-agent:latest"