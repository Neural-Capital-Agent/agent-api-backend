[agent]
name = "neural-capital-planner-agent"
version = "1.0.0"
description = "Neural Capital Financial Planning Agent - Creates comprehensive financial plans, investment strategies, and goal-based recommendations for clients"

[options]
OPENROUTER_API_KEY = { type = "string", description = "OpenRouter API key for AI model access" }
MISTRAL_API_KEY = { type = "string", description = "Mistral AI API key for language model access" }
PLANNING_HORIZON = { type = "number", description = "Default planning horizon in years", default = 10 }
MIN_PLANNING_HORIZON = { type = "number", description = "Minimum planning horizon in years", default = 1 }
MAX_PLANNING_HORIZON = { type = "number", description = "Maximum planning horizon in years", default = 30 }
INFLATION_ASSUMPTION = { type = "number", description = "Annual inflation assumption as decimal (0.03 = 3%)", default = 0.03 }
MARKET_RETURN_ASSUMPTION = { type = "number", description = "Annual market return assumption as decimal", default = 0.07 }
RISK_FREE_RATE = { type = "number", description = "Risk-free rate assumption as decimal", default = 0.02 }
ENABLE_MONTE_CARLO = { type = "boolean", description = "Enable Monte Carlo simulations for planning", default = true }
SIMULATION_ITERATIONS = { type = "number", description = "Number of Monte Carlo simulation iterations", default = 1000 }
CONFIDENCE_INTERVALS = { type = "string", description = "Confidence intervals for projections (comma-separated)", default = "0.10,0.50,0.90" }
GOAL_PRIORITIZATION = { type = "boolean", description = "Enable automatic goal prioritization", default = true }
TAX_OPTIMIZATION = { type = "boolean", description = "Include tax optimization strategies", default = true }
ESTATE_PLANNING = { type = "boolean", description = "Include estate planning considerations", default = false }
RETIREMENT_FOCUS = { type = "boolean", description = "Include retirement planning optimization", default = true }
LOG_LEVEL = { type = "string", description = "Logging level (DEBUG, INFO, WARNING, ERROR)", default = "INFO" }

[runtimes.docker]
image = "neural-capital/planner-agent:latest"