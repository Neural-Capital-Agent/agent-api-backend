[agent]
name = "neural-capital-explainability-agent"
version = "1.0.0"
description = "Neural Capital Explainability Agent - Provides transparent explanations for AI-driven investment decisions, risk assessments, and portfolio recommendations"

[options]
OPENROUTER_API_KEY = { type = "string", description = "OpenRouter API key for AI model access" }
MISTRAL_API_KEY = { type = "string", description = "Mistral AI API key for language model access" }
EXPLANATION_DEPTH = { type = "string", description = "Level of explanation detail: basic, detailed, comprehensive", default = "detailed" }
TECHNICAL_LEVEL = { type = "string", description = "Technical complexity level: beginner, intermediate, advanced", default = "intermediate" }
INCLUDE_CHARTS = { type = "boolean", description = "Include visual charts and graphs in explanations", default = true }
MAX_EXPLANATION_LENGTH = { type = "number", description = "Maximum length of explanations in words", default = 500 }
CONFIDENCE_THRESHOLD = { type = "number", description = "Minimum confidence level to provide explanations (0.0-1.0)", default = 0.7 }
ENABLE_RISK_WARNINGS = { type = "boolean", description = "Enable explicit risk warnings in explanations", default = true }
LANGUAGE = { type = "string", description = "Language for explanations (en, es, fr, de, etc.)", default = "en" }
INCLUDE_HISTORICAL_CONTEXT = { type = "boolean", description = "Include historical market context in explanations", default = true }
PERSONALIZATION_LEVEL = { type = "string", description = "Personalization level: none, basic, adaptive", default = "basic" }
REGULATORY_COMPLIANCE = { type = "boolean", description = "Ensure explanations meet regulatory compliance standards", default = true }
LOG_LEVEL = { type = "string", description = "Logging level (DEBUG, INFO, WARNING, ERROR)", default = "INFO" }

[runtimes.docker]
image = "neural-capital/explainability-agent:latest"